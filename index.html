<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CoC Compare">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CoC Compare</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="logo">⚔️</div>
      <div>
        <h1>CoC Compare</h1>
        <p>Compare deux joueurs Clash of Clans</p>
      </div>
    </header>

    <section class="card">
      <h2>👤 Joueurs</h2>

      <label for="player1">Joueur 1</label>
      <input id="player1" type="text" autocomplete="off" placeholder="#XXXXXXXX" maxlength="15">

      <label for="player2">Joueur 2</label>
      <input id="player2" type="text" autocomplete="off" placeholder="#XXXXXXXX" maxlength="15">

      <button id="compareBtn" class="primary">🔍 Comparer</button>
      <button id="clearBtn" class="secondary">Effacer</button>

      <p class="hint">Les tags sont enregistrés uniquement sur cet appareil.</p>
    </section>

    <section id="result" class="card hidden" aria-live="polite"></section>

    <footer>
      V1 • Interface prête pour la connexion aux vraies données
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
